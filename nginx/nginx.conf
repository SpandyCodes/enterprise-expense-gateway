worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # --- Standard reverse proxy (OAuth2 bearer-token API) -----------------
    server {
        listen 8080;

        location / {
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Correlation-Id $http_x_correlation_id;
        }
    }

    # --- mTLS-protected internal integration listener ---------------------
    server {
        listen 8443 ssl;

        ssl_certificate     /certs/server/server.crt;
        ssl_certificate_key /certs/server/server.key;

        ssl_client_certificate /certs/ca/ca.crt;
        ssl_verify_client on;   # reject any request without a valid client cert

        location /internal/ {
            # Strip any client-supplied value, then set it from the
            # verified certificate's CN so the app can trust the header.
            proxy_set_header X-Client-Cert-CN $ssl_client_s_dn_cn;
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
        }
    }
}
